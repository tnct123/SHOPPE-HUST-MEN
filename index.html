<style>
body{
font-family:'Segoe UI', Arial, sans-serif;
background: linear-gradient(135deg,#ffcc99,#ffffff);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
overflow:hidden;

.container{
background:white;
padding:40px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
text-align:center;
width:420px;

}

.logo{
width:200px;
margin-bottom:20px;

margin-left:auto;
margin-right:auto;
}

.title{

font-weight:bold;
color:#ff9800;
}

.message{
font-size:18px;
color:#444;
margin-top:10px;

}

.progress{
width:100%;
height:12px;
background:#eee;
border-radius:10px;
margin-top:25px;

}

.progress-bar{
height:100%;

<!-- FIREBASE TRACKING -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, runTransaction }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyBpThQgsy6FoGMFALL1mMdCDrupeqwD_c8",
authDomain: "hust-man.firebaseapp.com",
databaseURL: "https://hust-man-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId: "hust-man",
storageBucket: "hust-man.firebasestorage.app",
messagingSenderId: "1097366065563",
appId: "1:1097366065563:web:cd629b7a98138506ab113e"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// nguồn truy cập
let source = new URLSearchParams(window.location.search).get("utm_source") || "direct";

// lấy IP
fetch("https://ipapi.co/json/")
.then(res=>res.json())
.then(data=>{

push(ref(db,"logs"),{
time: new Date().toLocaleString(),
ip: data.ip,
country: data.country_name,
device: navigator.userAgent,
source: source,
link: window.location.href
});

// gửi Google Sheet
fetch("https://script.google.com/macros/s/AKfycbyoOJ_3R40UEWpRzWbRT4a7vgk7I0RRDjV4dQjg_txo4EMiU9mauapwxhq98aIvKrTdDA/exec?ip="+data.ip+
"&device="+navigator.userAgent+
"&source="+source);

});

// tăng tổng truy cập
runTransaction(ref(db,"counter"),(value)=>{
return (value || 0) + 1;
});

</script>

<script>

// tracking thời gian ở lại
let startTime = Date.now();

window.addEventListener("beforeunload", function () {

let stayTime = Math.round((Date.now() - startTime)/1000);

gtag('event','time_on_page',{
event_category:'engagement',
event_label:'stay_time',
value: stayTime
});

});

// redirect sau 20s
setTimeout(()=>{

gtag('event','redirect_shopee',{

});

window.location.href="https://vn.shp.ee/TuGyf3Ro";

},20000);

</script>
