<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đang xử lý...</title>

<style>

body{
    font-family:'Segoe UI',Arial,sans-serif;
    background: linear-gradient(135deg,#fff8e6,#ffffff);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

/* Khung chính */
.container{
    background:white;
    padding:40px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
    text-align:center;
    width:420px;
}

/* Logo */
.logo{
    width:200px;
    margin-bottom:20px;
}

/* Tiêu đề */
.title{
    font-size:26px;
    font-weight:bold;
    color:#ff9800;
}

/* Nội dung */
.message{
    font-size:18px;
    color:#444;
    margin-top:10px;
    line-height:1.6;
}

/* Thanh loading */
.progress{
    width:100%;
    height:12px;
    background:#eee;
    border-radius:10px;
    margin-top:25px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#ff9800;
    animation:load 10s linear forwards;
}

@keyframes load{
    from{width:0%;}
    to{width:100%;}
}

</style>

<script>

var linkChuyenHuong="https://vn.shp.ee/TuGyf3Ro";
var thoiGianCho=10000;

setTimeout(function(){
    window.location.href=linkChuyenHuong;
},thoiGianCho);

</script>

</head>

<body>

<div class="container">

<img src="logo.png" class="logo">

<div class="title">HUST-MEN</div>

<div class="message">
Hệ thống đang chuẩn bị mã giảm giá cho bạn.<br>
Vui lòng chờ trong giây lát...
</div>

<div class="progress">
<div class="progress-bar"></div>
</div>

</div>

</body>
</html>
