<!DOCTYPE html>

<head>

<style>

body{
font-family:'Segoe UI', Arial, sans-serif;
background: linear-gradient(135deg,#ffcc99,#ffffff);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
background:white;
padding:40px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
text-align:center;
width:420px;
max-width:90%;
}

.logo{
width:200px;
margin-bottom:20px;
display:block;
margin-left:auto;
margin-right:auto;
}

.title{
font-size:26px;
font-weight:bold;
color:#ff9800;
}

.message{
font-size:18px;
color:#444;
margin-top:10px;
line-height:1.6;
}

.progress{
width:100%;
height:12px;
background:#eee;
border-radius:10px;
margin-top:25px;
overflow:hidden;
}

.progress-bar{
height:100%;
width:0%;
background:#ff9800;
animation:load 10s linear forwards;
}

@keyframes load{
from{width:0%;}
to{width:100%;}
}

</style>

<script>

const linkChuyenHuong="https://vn.shp.ee/TuGyf3Ro";

</div>
